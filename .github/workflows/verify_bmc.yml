name: Regenerate BMC results from code and frozen prediction inputs
on:
  push:
    branches: [main, bmc-code-inputs-20261115]
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
      - name: Install pinned analysis dependencies
        run: python -m pip install -r code/requirements.txt
      - name: Reconstruct every BMC table and figure
        run: |
          python code/rebuild_missing_splits.py
          python code/reproduce_bmc.py --output generated/bmc
          test -s generated/bmc/Table1_regenerated.csv
          test -s generated/bmc/Table2_regenerated.csv
          test -s generated/bmc/Table3_regenerated.csv
          test -s generated/bmc/Table4_regenerated.csv
          test -s generated/bmc/figures/FigureS3_regenerated.pdf
          test -s generated/bmc/figures/FigureS4_regenerated.pdf
          test -s generated/bmc/figures/FigureS1_primary_delta010.pdf
      - name: Regenerate and check original numerical methods tables
        run: |
          python code/make_paper_tables.py
          python code/verify_release.py
      - name: Confirm current release has no stored manuscript or printed outputs
        run: |
          if git ls-files | grep -E '(^paper/|^generated/|\.tex$|\.pdf$|\.png$|Results_Tables_Figures|Official_Sources|Submission_Source)'; then
            echo 'Publication copy found in reproducibility repository'; exit 1
          fi
      - name: Publish tagged input-and-code release after checks pass
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v4.1.3-bmc >/dev/null 2>&1; then
            gh release create v4.1.3-bmc --target "$GITHUB_SHA" --title 'GoCo v4.1.3 — algorithms, frozen scores and reproduction code' --notes-file BMC_RELEASE_2026-11-15.md
          fi
          if gh release view v4.1.2-bmc >/dev/null 2>&1; then
            gh release delete v4.1.2-bmc --cleanup-tag --yes
          fi
