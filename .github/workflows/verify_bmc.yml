name: Verify GoCo BMC Bioinformatics release
on:
  push:
    branches:
      - main
      - bmc-final-20261115
permissions:
  contents: write
jobs:
  verify-bmc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas scipy
      - name: Extract reproducibility and source bundles
        run: |
          tar -tzf bmc_analysis/GoCo_BMC_Reproducibility_Extension_2026-11-15.tar.gz > /dev/null
          tar -tzf paper/bmc_2026-11-15/GoCo_BMC_Official_Sources_2026-11-15.tar.gz > /dev/null
          mkdir -p bmc_unpacked
          tar -xzf bmc_analysis/GoCo_BMC_Reproducibility_Extension_2026-11-15.tar.gz -C bmc_unpacked
          tar -xzf paper/bmc_2026-11-15/GoCo_BMC_Official_Sources_2026-11-15.tar.gz -C bmc_unpacked
      - name: Verify 400-split ablation and 800 paired differences
        run: |
          python bmc_unpacked/bmc_analysis/verify_ordering_ablation.py
          python bmc_unpacked/bmc_analysis/paired_archive/test_reproduce.py
      - name: Confirm approved source and AI disclosure
        run: |
          grep -Fq 'Our contributions are fourfold' bmc_unpacked/paper/bmc_2026-11-15/BMC_GoCo_main.tex
          grep -Fq 'The authors have reviewed and verified' bmc_unpacked/paper/bmc_2026-11-15/BMC_GoCo_main.tex
          grep -Fq 'delta=0.10' bmc_unpacked/paper/bmc_2026-11-15/BMC_GoCo_main.tex
      - name: Publish pinned GitHub release from verified main commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v4.1.0-bmc >/dev/null 2>&1; then
            gh release create v4.1.0-bmc --target "$GITHUB_SHA" --title 'GoCo v4.1.0 — BMC Bioinformatics submission' --notes-file BMC_RELEASE_2026-11-15.md
          fi
