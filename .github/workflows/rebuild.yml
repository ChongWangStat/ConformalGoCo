name: Rebuild and verify manuscript artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
      - name: Install frozen analysis dependencies
        run: python -m pip install -r code/requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q code
      - name: Verify explicit fold assignments
        run: python code/rebuild_missing_splits.py
      - name: Rebuild and check manuscript tables
        run: python code/make_paper_tables.py
      - name: Rebuild manuscript figures
        run: python code/make_figures.py
      - name: Check ranking-fold measurability on Wainberg split zero
        run: python code/test_measurability.py Wainberg 0
      - name: Verify release scope and archived result completeness
        run: python code/verify_release.py
      - name: Upload verification reports and regenerated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoCo-current-artifacts
          if-no-files-found: warn
          retention-days: 30
          path: |
            code/out/*.json
            paper/
            code/*.py
            code/requirements.txt
            splits/manifest.json
            README.md
            CODE_FREEZE.md
            CITATION.cff
