name: Publish GoCo v4.0.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v4.0.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v4.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: a0fd640cf3956d47cb7d4a5305e19558f9f48520
        run: |
          gh release create v4.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "GoCo v4.0.1" \
            --notes "Submission-synchronization release for the Briefings in Bioinformatics manuscript. This release aligns the public repository with the checked submission package: two main tables, Supplementary Tables S1-S13, synchronized manuscript PDFs/source bundle, figures, table specifications, verification files, README, and checksum manifest. No analysis method or numerical result was changed from v4.0.0."
